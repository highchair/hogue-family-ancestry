# This is where we store children of partnerships.
#
# The person.html template file does the heavy listing with different queries
#
# The "partnership" is our unique key.
# Use a unique identifier for the spouse, even if they do not have a page of their own.
# Why? We already ran into two different Pierres, and they need to be distinct.

# Format
#- partnership: 'combination of 2 unique IDs'
#  union-date: YYYY-MM-DD
#  union-location: 'string'
#  union-divorce-date: YYYY-MM-DD
#  children:
#    - child: 'name or unique ID'


